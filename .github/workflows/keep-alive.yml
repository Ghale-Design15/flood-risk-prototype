name: Keep API warm

# Render's free tier suspends the service after ~15 minutes of inactivity, and the
# next request pays a cold start (worse with the LSTM's TensorFlow load). This job
# pings /health every 10 minutes so the instance stays warm during active periods,
# and can be triggered by hand right before a demo. It never fails the build.
#
# Set the target once in the repo: Settings -> Secrets and variables -> Actions ->
# Variables -> new variable API_URL = https://flood-risk-api.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub cron timing is best-effort)
  workflow_dispatch:          # manual "wake it up now" button before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        continue-on-error: true
        run: |
          URL="${{ vars.API_URL }}"
          [ -z "$URL" ] && URL="https://flood-risk-api.onrender.com"
          echo "Pinging $URL/health"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$URL/health" || echo "000")
          echo "HTTP $code"
